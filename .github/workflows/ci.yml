name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cmd/beam_agent_web/package-lock.json
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy
          rustup override set 1.90.0
      - name: Workspace search dependency
        run: |
          brew install ripgrep
          rg --version
      - name: No local build or document-trial artifacts in Git
        run: |
          if git ls-files | grep -E '(^\.beam_agent/tmp/|^test\.docx$|^test-ros.*\.docx($|\.review-)|(^|/)(node_modules|target|_build|deps)/|(^|/)\.env($|\.local$))'; then
            echo 'Remove local/generated artifacts from the index before merging.'
            exit 1
          fi
      - name: Scan history for secrets (redacted output)
        run: go run github.com/zricethezav/gitleaks/v8@v8.24.2 git --redact=100 --no-banner --log-opts=--all .
      - name: Build clients and CLI
        run: mix loom.build --frontend all
      - name: Runtime checks
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test
      - name: Terminal checks
        run: |
          cargo test --locked --manifest-path cmd/beam_agent_ion/Cargo.toml
          cargo clippy --locked --manifest-path cmd/beam_agent_ion/Cargo.toml --all-targets -- -D warnings
          go test ./cmd/beam_agent_tui
      - name: Desk checks
        working-directory: cmd/beam_agent_web
        run: |
          mix format --check-formatted
          mix test
          npm ci
          npx playwright install chrome
          npm test
      - name: Whitespace checks
        run: git diff --check
