    <circle cx="1280" cy="220" r="11"/>
    <circle cx="1200" cy="320" r="11"/>
  </g>
  <circle cx="1020" cy="220" r="20" fill="#d8ff75"/>
  <circle cx="1020" cy="220" r="36" fill="none" stroke="#d8ff75" opacity=".2"/>
  <g fill="#c5ceda">
    <circle cx="1380" cy="120" r="5"/>
