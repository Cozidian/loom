<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">BeamAgent</title>
  <desc id="desc">Independent work. Visible progress. A dark editorial wordmark with a small connected actor constellation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10151f"/>
      <stop offset="1" stop-color="#19212e"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#a79bff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#a79bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#a9b4c4" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1600" height="440" rx="24" fill="url(#background)"/>
  <rect width="1600" height="440" rx="24" fill="url(#grid)"/>
  <ellipse cx="1240" cy="220" rx="350" ry="270" fill="url(#halo)"/>
  <path d="M80 82h38" stroke="#d8ff75" stroke-width="4" stroke-linecap="round"/>
  <text x="138" y="89" fill="#b5bfce" font-family="monospace" font-size="20" letter-spacing="4">ELIXIR / OTP</text>
  <text x="74" y="219" fill="#f1f4ec" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="700" letter-spacing="-6">Beam<tspan fill="#d8ff75">Agent</tspan></text>
  <text x="80" y="286" fill="#c5ceda" font-family="Arial, Helvetica, sans-serif" font-size="32">Independent work. Visible progress.</text>
  <text x="80" y="370" fill="#8694a9" font-family="monospace" font-size="17" letter-spacing="3">GOALS / ACTORS / EVIDENCE</text>
  <g fill="none" stroke="#667487" stroke-width="1.5">
    <path d="M1020 220h100l80-100h180"/>
    <path d="M1120 220h260"/>
    <path d="M1120 220l80 100h180"/>
